spring.application.name=brmc-account-service
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${BRMC_DB_URL:jdbc:postgresql://localhost:5432/brmc_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${BRMC_DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${BRMC_DB_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

brmc.security.username=${BRMC_APP_USERNAME:admin}
brmc.security.password=${BRMC_APP_PASSWORD:admin123}
brmc.exchange.remote-enabled=${BRMC_EXCHANGE_REMOTE_ENABLED:true}
brmc.exchange.usd-cop-fallback=${BRMC_USD_COP_FALLBACK:4000.00}
